services:
  - type: web
    name: agrimitra-ramarao-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: FRONTEND_URL
        value: https://ramaraomayara-creator.github.io
      - key: NODE_ENV
        value: production
