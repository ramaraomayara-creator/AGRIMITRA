name: Validate AGRIMITRA
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check JavaScript syntax
        run: |
          find js src shared backend -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
      - name: Check weather dashboard script is loaded
        run: |
          grep -q 'js/weather-india.js' index.html
          test -s js/weather-india.js
