name: AGRIMITRA CI
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find js src shared backend -type f -name '*.js' -print0)
      - name: Check weather module wiring
        run: |
          grep -q 'js/weather-india.js' index.html
          test -s js/weather-india.js
